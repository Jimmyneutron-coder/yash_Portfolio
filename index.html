<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yash-Portfolio</title>
  <meta name="description" content="Personal portfolio website" />
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- ===== Loading state (replaced once data.json loads) ===== -->
  <div id="loader" class="loader" aria-hidden="true">
    <span class="loader__bracket">&lt;</span>
    <span class="loader__dot"></span>
    <span class="loader__bracket">/&gt;</span>
  </div>

  <!-- ===== Navbar ===== -->
  <header class="navbar" id="navbar">
    <nav class="nav container">
      <a href="#hero" class="nav__logo" id="navLogo">YM</a>

      <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav__menu" id="navMenu">
        <li><a href="#about" class="nav__link">About</a></li>
        <li><a href="#skills" class="nav__link">Skills</a></li>
        <li><a href="#projects" class="nav__link">Projects</a></li>
        <li><a href="#experience" class="nav__link">Experience</a></li>
        <li><a href="#education" class="nav__link">Education</a></li>
        <li><a href="#contact" class="nav__link nav__link--cta">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- ===== Hero ===== -->
    <section class="hero" id="hero">
      <div class="container hero__grid">
        <div class="hero__content">
          <p class="eyebrow" id="heroGreeting">$ whoami</p>
          <h1 class="hero__name" id="heroName">Loading…</h1>
          <p class="hero__profession"><span class="cursor-line" id="heroProfession"></span></p>
          <p class="hero__intro" id="heroIntro"></p>

          <div class="hero__actions">
            <a href="#" class="btn btn--primary" id="heroResume" download>Download Résumé</a>
            <a href="#contact" class="btn btn--ghost">Get In Touch</a>
          </div>

          <ul class="social-list" id="heroSocials" aria-label="Social media links"></ul>
        </div>

        <div class="hero__visual">
          <div class="hero__frame">
            <img id="heroImage" src="" alt="Profile photo" />
          </div>
        </div>
      </div>
      <a href="#about" class="scroll-cue" aria-label="Scroll to About section">
        <span></span>
      </a>
    </section>

    <!-- ===== About ===== -->
    <section class="section" id="about">
      <div class="container">
        <p class="eyebrow" id="aboutEyebrow"></p>
        <h2 class="section__heading" id="aboutHeading"></h2>

        <div class="about__grid">
          <div class="about__text" id="aboutText"></div>
          <ul class="about__stats" id="aboutStats"></ul>
        </div>
      </div>
    </section>

    <!-- ===== Skills ===== -->
    <section class="section section--alt" id="skills">
      <div class="container">
        <p class="eyebrow" id="skillsEyebrow"></p>
        <h2 class="section__heading" id="skillsHeading"></h2>

        <div class="skills__grid" id="skillsGrid"></div>
      </div>
    </section>

    <!-- ===== Projects ===== -->
    <section class="section" id="projects">
      <div class="container">
        <p class="eyebrow" id="projectsEyebrow"></p>
        <h2 class="section__heading" id="projectsHeading"></h2>

        <div class="projects__grid" id="projectsGrid"></div>
      </div>
    </section>

    <!-- ===== Experience ===== -->
    <section class="section section--alt" id="experience">
      <div class="container">
        <p class="eyebrow" id="experienceEyebrow"></p>
        <h2 class="section__heading" id="experienceHeading"></h2>

        <div class="timeline" id="experienceTimeline"></div>
      </div>
    </section>

    <!-- ===== Education ===== -->
    <section class="section" id="education">
      <div class="container">
        <p class="eyebrow" id="educationEyebrow"></p>
        <h2 class="section__heading" id="educationHeading"></h2>

        <div class="timeline" id="educationTimeline"></div>
      </div>
    </section>

    <!-- ===== Contact ===== -->
    <section class="section section--alt" id="contact">
      <div class="container contact__grid">
        <div>
          <p class="eyebrow" id="contactEyebrow"></p>
          <h2 class="section__heading" id="contactHeading"></h2>
          <p class="contact__desc" id="contactDesc"></p>

          <ul class="contact__info" id="contactInfo"></ul>
        </div>

        <form class="contact__form" id="contactForm" novalidate>
          <div class="form__group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required />
          </div>
          <div class="form__group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="form__group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell me about your project…" required></textarea>
          </div>
          <button type="submit" class="btn btn--primary btn--block">Send Message</button>
          <p class="form__status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container footer__grid">
      <a href="#hero" class="nav__logo" id="footerLogo">AM</a>
      <ul class="social-list" id="footerSocials" aria-label="Social media links"></ul>
    </div>
    <div class="container footer__bottom">
      <p id="footerText"></p>
      <p id="footerCopyright"></p>
    </div>
  </footer>

  <!-- ===== Back to top ===== -->
  <button id="backToTop" class="back-to-top" aria-label="Back to top">↑</button>

  <script src="js/app.js"></script>
</body>
</html>
